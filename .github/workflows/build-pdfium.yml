name: Build PDFium WASM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/pdfium/build/**'
      - 'packages/pdfium/test/**'
      - 'packages/pdfium/scripts/**'
      - 'packages/pdfium/Dockerfile'
      - 'packages/pdfium/docker-compose.yml'
      - '.github/workflows/build-pdfium.yml'
      - '.gitmodules'

permissions:
  contents: write

concurrency:
  group: build-pdfium
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Init pdfium submodule
        run: |
          git submodule update --init --depth 1 packages/pdfium/pdfium-src || git submodule update --init packages/pdfium/pdfium-src

      - name: Apply pdfium patches
        working-directory: packages/pdfium
        run: |
          for p in security-fixes editcore-pdfium; do
            if ! git -C pdfium-src apply --reverse --check "$PWD/build/patch/$p.patch" 2>/dev/null; then
              git -C pdfium-src apply "$PWD/build/patch/$p.patch"
            fi
          done

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: packages/pdfium
          target: pdfium-deps
          tags: embedpdf/pdfium-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Restore ninja object cache
        uses: actions/cache@v4
        with:
          path: packages/pdfium/pdfium-src/out/wasm
          key: pdfium-out-${{ github.sha }}
          restore-keys: |
            pdfium-out-

      - name: Build pdfium.wasm
        working-directory: packages/pdfium
        run: |
          docker compose run --rm pdfium-build

      - name: Verify EditCore exports
        run: |
          test -s packages/pdfium/src/vendor/pdfium.wasm
          grep -c ec_ packages/pdfium/src/vendor/functions.ts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run EditCore engine tests
        working-directory: packages/pdfium
        run: node --test test/*.test.mjs

      - name: Publish the built engine
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          FILES="packages/pdfium/src/vendor/pdfium.js \
                 packages/pdfium/src/vendor/pdfium.wasm \
                 packages/pdfium/src/vendor/pdfium.cjs \
                 packages/pdfium/src/vendor/functions.ts \
                 packages/pdfium/src/vendor/runtime-methods.ts"
          if git diff --quiet -- $FILES; then
            echo "Engine unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: publish pdfium.wasm built from ${GITHUB_SHA:0:12}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Stage link inputs for local rebuilds
        if: always()
        working-directory: packages/pdfium
        run: |
          set +e
          mkdir -p ../../link-inputs/pdfium-src/out/wasm/obj ../../link-inputs/build/wasm
          docker compose run --rm --entrypoint /bin/bash pdfium-build -c \
            'cp /workspace/packages/pdfium/pdfium-src/out/wasm/obj/libembedpdf.a /workspace/link-inputs/pdfium-src/out/wasm/obj/' \
            || echo "libembedpdf.a unavailable in the build volume"
          cp build/wasm/exported-functions.txt build/wasm/exported-runtime-methods.txt \
             ../../link-inputs/build/wasm/ \
            || echo "export lists unavailable"
          find ../../link-inputs -type f -exec ls -la {} +

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdfium-link-inputs
          path: link-inputs/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdfium-vendor
          path: packages/pdfium/src/vendor/
          if-no-files-found: error
          retention-days: 14

